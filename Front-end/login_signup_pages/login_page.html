<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signrest — Login &amp; Sign-up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth_style.css" />
  <link rel="stylesheet" href="tailwind.css" />
</head>
<body>

  <div id="bgPhotoLayer" class="bg-photo-layer"></div>
  <div class="bg-veil"></div>

  <header class="brand-header">
    <img id="brandLogoImg" class="brand-logo-img" alt="Signrest Logo" />
    <span class="brand-title">Signrest</span>
  </header>

  <button
    type="button"
    id="themeToggleBtn"
    class="theme-toggle-btn"
    aria-label="Toggle Light or Dark Mode"
    title="Switch Light / Dark Mode"
  >
    <img id="themeIconImg" alt="Theme Toggle Icon" />
  </button>

  <div id="leafToastWrapper" class="leaf-toast-wrapper" role="alert" aria-live="assertive">
    <div id="leafToastCard" class="leaf-toast-card" style="padding: 22px 42px 24px 48px;">
      <img
        id="leafToastSproutImg"
        class="leaf-toast-plane"
        style="top: -34px; left: -34px; width: 92px;"
        alt=""
      />
      <button type="button" id="leafToastCloseBtn" class="leaf-toast-close" aria-label="Close notification">
        X
      </button>
      <p id="leafToastMessage" class="leaf-toast-text">
        This email is already in use!
      </p>
      <!-- One bar per second of the 5s toast lifetime -->
      <div class="leaf-toast-bars" aria-hidden="true">
        <span class="leaf-toast-bar" data-step="0"></span>
        <span class="leaf-toast-bar" data-step="1"></span>
        <span class="leaf-toast-bar" data-step="2"></span>
        <span class="leaf-toast-bar" data-step="3"></span>
        <span class="leaf-toast-bar" data-step="4"></span>
      </div>
    </div>
  </div>

  <div class="scenery-layer">
    <div class="rock-frog-group">
      <img id="sceneryRock" class="scenery-item scenery-rock" alt="" />
      <div class="frog-lamp-aura" aria-hidden="true"></div>
      <button
        type="button"
        id="frogThemeToggleBtn"
        class="frog-theme-toggle"
        aria-label="Switch to dark mode"
        title="Switch to dark mode"
      >
        <img id="sceneryFrog" class="scenery-item scenery-frog" alt="" />
      </button>
    </div>

    <img id="sceneryBush1" class="scenery-item scenery-bush-left" alt="" />
    <img id="sceneryBush2" class="scenery-item scenery-bush-mid-left" alt="" />
    <img id="sceneryBush3" class="scenery-item scenery-bush-mid-right" alt="" />
    <img id="sceneryBushRight" class="scenery-item scenery-bush-right" alt="" />
  </div>

  <main class="relative z-20 min-h-screen flex flex-col items-center justify-center px-6 pb-28 sm:pb-20 pt-10 pointer-events-none">
    <div class="w-full max-w-[290px] pointer-events-auto">

      <form id="authForm" novalidate>
        <div class="mb-2">
          <label for="emailInput" class="field-label">Email</label>
          <input
            type="email"
            id="emailInput"
            name="email"
            class="underlined-field"
            autocomplete="email"
            required
          />
          <p id="emailErrorMsg" class="field-error-msg" aria-live="polite"></p>
        </div>

        <div class="mb-1">
          <label for="passwordInput" class="field-label">Password</label>
          <input
            type="password"
            id="passwordInput"
            name="password"
            class="underlined-field"
            autocomplete="new-password"
            required
          />
          <p id="passwordErrorMsg" class="field-error-msg" aria-live="polite"></p>
        </div>

        <div id="confirmPasswordGroup" class="mt-2 mb-1">
          <label for="confirmPasswordInput" class="field-label">Confirm Password</label>
          <input
            type="password"
            id="confirmPasswordInput"
            name="confirm_password"
            class="underlined-field"
            autocomplete="new-password"
          />
          <p id="confirmPasswordErrorMsg" class="field-error-msg" aria-live="polite"></p>
        </div>

        <div id="forgotPswRow" class="hidden items-center justify-between mb-4">
          <label for="rememberMeInput" class="remember-me-label">
            <input type="checkbox" id="rememberMeInput" name="remember_me" class="remember-me-checkbox" checked />
            <span>Remember me</span>
          </label>
          <a href="/forgot-password" id="forgotPswLink" class="sub-link">forgot password?</a>
        </div>

        <div id="signupSpacer" class="h-3"></div>

        <button type="submit" id="primarySubmitBtn" class="btn-primary-pill" disabled>
          SIGN UP
        </button>

        <div class="text-center my-2 text-[0.88rem] font-medium" style="color: var(--text-primary);">
          or
        </div>

        <button type="button" id="googleAuthBtn" class="btn-google-pill">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#EA4335" d="M12 5c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 1.77 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#34A853" d="M12 23c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          </svg>
          <span id="googleBtnText">Sign up with Google</span>
        </button>

        <div class="flex items-center justify-between mt-3 px-2">
          <span id="switchPromptText" class="text-[0.82rem]" style="color: var(--text-primary);">
            already had an account?
          </span>
          <button
            type="button"
            id="switchModeBtn"
            class="sub-link bg-transparent border-none p-0 text-[0.84rem]"
          >
            login
          </button>
        </div>
      </form>

    </div>
  </main>

  <script>
    const ASSETS = {
      logo:          "../assets/images/logo.png",
      alertLeaves:   "../assets/images/signup_invalid_noti.png",
      alertHorn:     "../assets/images/login_invalid_horn.png",
      bgSignupLight: "../assets/images/login_bg_7.jpg",
      bgSignupDark:  "../assets/images/login_bg_night_5.jpg",
      bgLoginLight:  "../assets/images/login_bg_8.jpg",
      bgLoginDark:   "../assets/images/login_bg_night_6.jpg",
      frog:          "../assets/images/frog-removebg.png",
      rockLight:     "../assets/images/stone-removebg.png",
      rockDark:      "../assets/images/rock_night.png",
      bush3xLight:   "../assets/images/bush_bgremove.png",
      bush3xDark:    "../assets/images/bush_night.png",
      bushRightLight:"../assets/images/bush_1_bgremove.png",
      bushRightDark: "../assets/images/bush_1_night.png",
      iconSun:       "../assets/images/sun_bgremove.png",
      iconMoon:      "../assets/images/moon_bgremove.png"
    };

    const PREVIEW_FALLBACKS = {
      logo:          "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='#3e5d3e'/><path d='M20 40 C20 26, 34 18, 46 20 C44 33, 35 43, 20 40 Z' fill='#b9e396'/><path d='M20 40 C27 33, 35 27, 45 21' fill='none' stroke='#263d26' stroke-width='2.5' stroke-linecap='round'/><circle cx='24' cy='23' r='3' fill='#e6f7d4'/></svg>`),
      alertLeaves:   "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 95'><path d='M66 78 C46 58, 28 38, 12 22 C35 24, 56 38, 66 78 Z' fill='#a9c582'/><path d='M69 76 C62 49, 64 25, 72 6 C84 25, 84 52, 69 76 Z' fill='#9bb974'/><path d='M65 81 C46 78, 30 74, 18 67 C34 61, 51 66, 65 81 Z' fill='#9fb97a'/></svg>`),
      alertHorn:     "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><g transform='rotate(-26 60 60)'><path d='M16 48 L44 48 L44 72 L16 72 Z' fill='#9e2020'/><path d='M44 46 L94 24 L94 96 L44 74 Z' fill='#ece6d6' stroke='#b92525' stroke-width='4'/><path d='M36 72 L44 102 L58 98 L48 72 Z' fill='#d6c9b4'/></g></svg>`),
      bgSignupLight: "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#d8e6d5'/><stop offset='55%' stop-color='#eef3e6'/><stop offset='100%' stop-color='#a4c298'/></linearGradient></defs><rect width='100%' height='100%' fill='url(#g)'/></svg>`),
      bgSignupDark:  "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#192634'/><stop offset='50%' stop-color='#2b3c4d'/><stop offset='100%' stop-color='#131d27'/></linearGradient></defs><rect width='100%' height='100%' fill='url(#g)'/></svg>`),
      bgLoginLight:  "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#e4ece2'/><stop offset='65%' stop-color='#f4f7f0'/><stop offset='100%' stop-color='#9cb98e'/></linearGradient></defs><rect width='100%' height='100%' fill='url(#g)'/></svg>`),
      bgLoginDark:   "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#1d2c3b'/><stop offset='60%' stop-color='#324659'/><stop offset='100%' stop-color='#16222e'/></linearGradient></defs><rect width='100%' height='100%' fill='url(#g)'/></svg>`),
      frog:          "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 150'><ellipse cx='80' cy='92' rx='54' ry='42' fill='#9be15d' stroke='#4d6b2a' stroke-width='3'/><circle cx='54' cy='58' r='16' fill='#b7ec6e' stroke='#4d6b2a' stroke-width='3'/><circle cx='106' cy='58' r='16' fill='#b7ec6e' stroke='#4d6b2a' stroke-width='3'/></svg>`),
      rockLight:     "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 260'><polygon points='115,220 140,65 210,35 265,195 235,225' fill='#8c745c'/></svg>`),
      rockDark:      "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 260'><polygon points='115,220 140,65 210,35 265,195 235,225' fill='#334152'/></svg>`),
      bush3xLight:   "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 210'><circle cx='160' cy='105' r='76' fill='#7cb342'/></svg>`),
      bush3xDark:    "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 210'><circle cx='160' cy='105' r='76' fill='#386155'/></svg>`),
      bushRightLight:"data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 360 220'><circle cx='195' cy='125' r='82' fill='#7cb342'/></svg>`),
      bushRightDark: "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 360 220'><circle cx='195' cy='125' r='82' fill='#2d5244'/></svg>`),
      iconMoon:      "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='#e2e8f0'><path d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'/></svg>`),
      iconSun:       "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='#f59e0b' stroke='#f59e0b' stroke-width='2'><circle cx='12' cy='12' r='5'/></svg>`)
    };

    const API_ENDPOINTS = {
      signup: "/api/signup",
      login: "/api/login",
      googleAuth: "/api/auth/google"
    };

    const savedTheme = localStorage.getItem("signrest_theme");
    const urlMode = new URLSearchParams(location.search).get("mode");
    const isSignupPath = /^\/signup\/?$/.test(location.pathname);
    const state = {
      mode: (urlMode === "signup" || (urlMode !== "login" && isSignupPath)) ? "signup" : "login",
      theme: savedTheme === "dark" ? "dark" : "light",
      isSubmitting: false
    };

    const touched = {
      email: false,
      password: false,
      confirmPassword: false
    };

    const bgPhotoLayer = document.getElementById("bgPhotoLayer");
    const brandLogoImg = document.getElementById("brandLogoImg");
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const themeIconImg = document.getElementById("themeIconImg");

    const sceneryRock = document.getElementById("sceneryRock");
    const frogThemeToggleBtn = document.getElementById("frogThemeToggleBtn");
    const sceneryFrog = document.getElementById("sceneryFrog");
    const sceneryBush1 = document.getElementById("sceneryBush1");
    const sceneryBush2 = document.getElementById("sceneryBush2");
    const sceneryBush3 = document.getElementById("sceneryBush3");
    const sceneryBushRight = document.getElementById("sceneryBushRight");

    const authForm = document.getElementById("authForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const confirmPasswordGroup = document.getElementById("confirmPasswordGroup");
    const confirmPasswordInput = document.getElementById("confirmPasswordInput");

    const emailErrorMsg = document.getElementById("emailErrorMsg");
    const passwordErrorMsg = document.getElementById("passwordErrorMsg");
    const confirmPasswordErrorMsg = document.getElementById("confirmPasswordErrorMsg");
    const rememberMeInput = document.getElementById("rememberMeInput");

    const forgotPswRow = document.getElementById("forgotPswRow");
    const signupSpacer = document.getElementById("signupSpacer");
    const primarySubmitBtn = document.getElementById("primarySubmitBtn");
    const googleAuthBtn = document.getElementById("googleAuthBtn");
    const googleBtnText = document.getElementById("googleBtnText");
    const switchPromptText = document.getElementById("switchPromptText");
    const switchModeBtn = document.getElementById("switchModeBtn");

    const leafToastWrapper = document.getElementById("leafToastWrapper");
    const leafToastCard = document.getElementById("leafToastCard");
    const leafToastSproutImg = document.getElementById("leafToastSproutImg");
    const leafToastMessage = document.getElementById("leafToastMessage");
    const leafToastCloseBtn = document.getElementById("leafToastCloseBtn");
    const leafToastBars = Array.from(document.querySelectorAll(".leaf-toast-bar"));
    let toastInterval = null;

    function applyImageWithFallback(imgEl, assetKey) {
      imgEl.onerror = () => {
        imgEl.onerror = null;
        imgEl.src = PREVIEW_FALLBACKS[assetKey];
      };
      imgEl.src = ASSETS[assetKey];
    }

    function applyBackgroundSwatch() {
      let key = "bgSignupLight";
      if (state.theme === "light" && state.mode === "signup") key = "bgSignupLight";
      if (state.theme === "dark"  && state.mode === "signup") key = "bgSignupDark";
      if (state.theme === "light" && state.mode === "login")  key = "bgLoginLight";
      if (state.theme === "dark"  && state.mode === "login")  key = "bgLoginDark";

      const testImg = new Image();
      testImg.onload = () => {
        bgPhotoLayer.style.backgroundImage = `url('${ASSETS[key]}')`;
      };
      testImg.onerror = () => {
        bgPhotoLayer.style.backgroundImage = `url('${PREVIEW_FALLBACKS[key]}')`;
      };
      testImg.src = ASSETS[key];
    }

    function renderTheme() {
      const isDark = state.theme === "dark";
      const nextThemeLabel = `Switch to ${isDark ? "light" : "dark"} mode`;
      document.body.classList.toggle("dark-mode", isDark);
      localStorage.setItem("signrest_theme", state.theme);
      frogThemeToggleBtn.setAttribute("aria-label", nextThemeLabel);
      frogThemeToggleBtn.title = nextThemeLabel;

      applyImageWithFallback(brandLogoImg, "logo");
      applyImageWithFallback(leafToastSproutImg, state.mode === "login" ? "alertHorn" : "alertLeaves");
      applyImageWithFallback(themeIconImg, isDark ? "iconMoon" : "iconSun");

      applyImageWithFallback(sceneryRock, isDark ? "rockDark" : "rockLight");
      applyImageWithFallback(sceneryBush1, isDark ? "bush3xDark" : "bush3xLight");
      applyImageWithFallback(sceneryBush2, isDark ? "bush3xDark" : "bush3xLight");
      applyImageWithFallback(sceneryBush3, isDark ? "bush3xDark" : "bush3xLight");
      applyImageWithFallback(sceneryBushRight, isDark ? "bushRightDark" : "bushRightLight");
      applyImageWithFallback(sceneryFrog, "frog");

      applyBackgroundSwatch();
    }

    /**
     * Triggers the corner popup notification:
     * - In Signup mode: Sage green card + 3-leaf icon (`signup_invalid_noti.png`)
     * - In Login mode: Warm stone beige card + angled red megaphone (`login_invalid_horn.png`)
     */
    function triggerLeafAlert(message) {
      if (toastInterval) clearInterval(toastInterval);

      const isLoginAlert = state.mode === "login";
      leafToastCard.classList.toggle("toast-horn", isLoginAlert);

      if (isLoginAlert) {
        applyImageWithFallback(leafToastSproutImg, "alertHorn");
        leafToastSproutImg.style.top = "-38px";
        leafToastSproutImg.style.left = "-40px";
        leafToastSproutImg.style.width = "102px";
        leafToastSproutImg.style.transform = "rotate(-22deg)";
      } else {
        applyImageWithFallback(leafToastSproutImg, "alertLeaves");
        leafToastSproutImg.style.top = "-34px";
        leafToastSproutImg.style.left = "-34px";
        leafToastSproutImg.style.width = "92px";
        leafToastSproutImg.style.transform = "none";
      }

      leafToastMessage.textContent = message;
      leafToastBars.forEach((bar) => bar.classList.remove("elapsed"));
      leafToastWrapper.classList.add("show");

      let elapsedSeconds = 0;
      toastInterval = setInterval(() => {
        if (elapsedSeconds < 5) {
          const barIndex = 4 - elapsedSeconds;
          if (leafToastBars[barIndex]) {
            leafToastBars[barIndex].classList.add("elapsed");
          }
          elapsedSeconds += 1;
        } else {
          hideLeafAlert();
        }
      }, 1000);
    }

    function hideLeafAlert() {
      if (toastInterval) {
        clearInterval(toastInterval);
        toastInterval = null;
      }
      leafToastWrapper.classList.remove("show");
    }

    leafToastCloseBtn.addEventListener("click", hideLeafAlert);

    function checkEmailValid(emailVal) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
      if (!emailVal) return { valid: false, msg: "Email is required." };
      if (!emailRegex.test(emailVal)) return { valid: false, msg: "Please enter a valid email address." };
      return { valid: true, msg: "" };
    }

    function checkPasswordValid(pswVal) {
      if (!pswVal) {
        return { valid: false, msg: "Password is required." };
      }
      if (state.mode === "login") {
        return { valid: true, msg: "" };
      }
      if (pswVal.length < 8) {
        return { valid: false, msg: "At least 8 characters required." };
      }
      if (!/[A-Z]/.test(pswVal)) {
        return { valid: false, msg: "Include at least one capital letter (A-Z)." };
      }
      if (!/[0-9]/.test(pswVal)) {
        return { valid: false, msg: "Include at least one number (0-9)." };
      }
      if (!/[^A-Za-z0-9]/.test(pswVal)) {
        return { valid: false, msg: "Include at least one special character (!@#$...)." };
      }
      return { valid: true, msg: "" };
    }

    function checkConfirmPasswordValid(pswVal, confirmVal) {
      if (state.mode === "login") {
        return { valid: true, msg: "" };
      }
      if (!confirmVal) {
        return { valid: false, msg: "Please confirm your password." };
      }
      if (pswVal !== confirmVal) {
        return { valid: false, msg: "Passwords do not match." };
      }
      return { valid: true, msg: "" };
    }

    function validateFormState(forceShowErrors = false) {
      const emailVal = emailInput.value.trim();
      const pswVal = passwordInput.value;
      const confirmVal = confirmPasswordInput.value;

      const emailRes = checkEmailValid(emailVal);
      const pswRes = checkPasswordValid(pswVal);
      const confirmRes = checkConfirmPasswordValid(pswVal, confirmVal);

      emailErrorMsg.textContent = (touched.email || forceShowErrors) && !emailRes.valid ? emailRes.msg : "";

      if (state.mode === "signup") {
        passwordErrorMsg.textContent = (touched.password || forceShowErrors) && !pswRes.valid ? pswRes.msg : "";
        confirmPasswordErrorMsg.textContent =
          (touched.confirmPassword || forceShowErrors) && !confirmRes.valid ? confirmRes.msg : "";
      } else {
        passwordErrorMsg.textContent = "";
        confirmPasswordErrorMsg.textContent = "";
      }

      const allFieldsFilled =
        state.mode === "signup"
          ? Boolean(emailVal && pswVal && confirmVal)
          : Boolean(emailVal && pswVal);

      const isFormValid = allFieldsFilled && emailRes.valid && pswRes.valid && confirmRes.valid;

      if (!state.isSubmitting) {
        primarySubmitBtn.disabled = !isFormValid;
      }

      return isFormValid;
    }

    function renderAuthMode() {
      hideLeafAlert();
      const isSignup = state.mode === "signup";

      touched.email = false;
      touched.password = false;
      touched.confirmPassword = false;
      emailErrorMsg.textContent = "";
      passwordErrorMsg.textContent = "";
      confirmPasswordErrorMsg.textContent = "";

      if (isSignup) {
        confirmPasswordGroup.classList.remove("hidden");
        forgotPswRow.classList.add("hidden");
        forgotPswRow.classList.remove("flex");
        signupSpacer.classList.remove("hidden");

        primarySubmitBtn.textContent = "SIGN UP";
        googleBtnText.textContent = "Sign up with Google";
        switchPromptText.textContent = "already had an account?";
        switchModeBtn.textContent = "login";
        passwordInput.setAttribute("autocomplete", "new-password");
      } else {
        confirmPasswordGroup.classList.add("hidden");
        forgotPswRow.classList.remove("hidden");
        forgotPswRow.classList.add("flex");
        signupSpacer.classList.add("hidden");

        primarySubmitBtn.textContent = "LOGIN";
        googleBtnText.textContent = "Login with Google";
        switchPromptText.textContent = "don’t have an account?";
        switchModeBtn.textContent = "sign-up";
        passwordInput.setAttribute("autocomplete", "current-password");
      }

      applyBackgroundSwatch();
      validateFormState(false);
    }

    function setButtonLoading(buttonEl, isLoading, defaultHtml) {
      state.isSubmitting = isLoading;
      if (isLoading) {
        buttonEl.disabled = true;
        buttonEl.innerHTML = `<span class="btn-spinner" aria-hidden="true"></span>`;
      } else {
        buttonEl.innerHTML = defaultHtml;
        validateFormState(false);
      }
    }

    emailInput.addEventListener("input", () => {
      touched.email = true;
      validateFormState(false);
    });

    passwordInput.addEventListener("input", () => {
      touched.password = true;
      validateFormState(false);
    });

    confirmPasswordInput.addEventListener("input", () => {
      touched.confirmPassword = true;
      validateFormState(false);
    });

    rememberMeInput.checked = localStorage.getItem("signrest_remember_me") !== "0";
    rememberMeInput.addEventListener("change", () => {
      localStorage.setItem("signrest_remember_me", rememberMeInput.checked ? "1" : "0");
    });

    function toggleTheme() {
      state.theme = state.theme === "light" ? "dark" : "light";
      renderTheme();
    }

    themeToggleBtn.addEventListener("click", toggleTheme);
    frogThemeToggleBtn.addEventListener("click", toggleTheme);

    switchModeBtn.addEventListener("click", () => {
      state.mode = state.mode === "signup" ? "login" : "signup";
      try { history.replaceState(null, "", state.mode === "signup" ? "/signup" : "/login"); } catch (e) {}
      renderAuthMode();
    });

    googleAuthBtn.addEventListener("click", () => {
      hideLeafAlert();
      const originalGoogleHtml = googleAuthBtn.innerHTML;
      setButtonLoading(googleAuthBtn, true, originalGoogleHtml);
      primarySubmitBtn.disabled = true;

      setTimeout(() => {
        window.location.href = `${API_ENDPOINTS.googleAuth}?mode=${state.mode}&remember=${rememberMeInput.checked ? "1" : "0"}`;
      }, 350);
    });

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideLeafAlert();

      if (!validateFormState(true)) {
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      const endpoint = state.mode === "signup" ? API_ENDPOINTS.signup : API_ENDPOINTS.login;
      const originalBtnHtml = primarySubmitBtn.innerHTML;
      setButtonLoading(primarySubmitBtn, true, originalBtnHtml);
      googleAuthBtn.disabled = true;

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email,
            password,
            platform: "web",
            remember_me: rememberMeInput.checked
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          triggerLeafAlert(data.message || "Authentication failed.");
          setButtonLoading(primarySubmitBtn, false, originalBtnHtml);
          googleAuthBtn.disabled = false;
        } else {
          if (state.mode === "signup") {
            sessionStorage.setItem("signrest_otp_just_sent", "1");
          }
          window.location.href =
            data.redirect_url ||
            (state.mode === "signup" ? `otp_verify.html?email=${encodeURIComponent(email)}` : "/home");
        }
      } catch (err) {
        setButtonLoading(primarySubmitBtn, false, originalBtnHtml);
        googleAuthBtn.disabled = false;
        triggerLeafAlert("Server connection error. Please try again.");
      }
    });

    renderTheme();
    renderAuthMode();
  </script>
</body>
</html>
