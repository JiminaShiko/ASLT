<style>
#admin-sidebar {
  --sb-bg: var(--surface, #fbfaf5);
  --sb-bg-deep: var(--bg, #f0f3e9);
  --sb-text: var(--text, #2f3d33);
  --sb-muted: var(--muted, #667369);
  --sb-border: var(--border, #dcdfd2);
  --sb-sage: var(--sage, #4a6f53);
  --sb-active: color-mix(in oklab, var(--sb-sage) 15%, var(--sb-bg));
  --sb-hover: color-mix(in oklab, var(--sb-sage) 9%, transparent);
  --sb-action-text: #fff;

  position: fixed;
  inset: 0 auto 0 0;
  z-index: 20;
  display: flex;
  width: 248px;
  flex-direction: column;
  overflow: visible;
  color: var(--sb-text);
  background:
    radial-gradient(circle at 12% 4%, color-mix(in oklab, var(--sb-sage) 9%, transparent), transparent 30%),
    linear-gradient(180deg, var(--sb-bg), var(--sb-bg-deep));
  border-right: 1px solid var(--sb-border);
  box-shadow: 12px 0 36px rgb(9 24 17 / 8%);
}

:root[data-theme="dark"] #admin-sidebar {
  --sb-action-text: var(--bg, #1d2620);
}

.app > .main {
  width: calc(100% - 248px);
  margin-left: 248px;
}

/* Brand */
#admin-sidebar .brand {
  position: relative;
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 96px;
  padding: 0 26px 0 22px;
  border-bottom: 1px solid var(--sb-border);
  font: 500 25px "Playfair Display", Georgia, serif;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

#admin-sidebar .brand-logo {
  display: block;
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  object-fit: contain;
}

#admin-sidebar .sidebar-collapse {
  position: absolute;
  top: 34px;
  right: -14px;
  z-index: 2;
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  padding: 0;
  color: var(--sb-action-text);
  background: var(--sb-sage);
  border: 1px solid color-mix(in oklab, var(--sb-sage) 70%, var(--sb-border));
  border-radius: 50%;
  box-shadow: 0 3px 10px rgb(4 16 10 / 28%);
  cursor: pointer;
  transition: background .18s, transform .18s;
}

#admin-sidebar .sidebar-collapse:hover {
  filter: brightness(1.08);
}

#admin-sidebar .sidebar-collapse svg {
  width: 15px;
  height: 15px;
  color: var(--sb-action-text);
  transition: transform .18s;
}

.app.collapsed #admin-sidebar {
  width: 80px;
}

.app.collapsed #admin-sidebar .brand {
  justify-content: center;
  padding: 0;
}

.app.collapsed #admin-sidebar .brand-logo {
  width: 44px;
  height: 44px;
  flex-basis: 44px;
}

.app.collapsed #admin-sidebar .brand-name,
.app.collapsed #admin-sidebar .nav-label,
.app.collapsed #admin-sidebar .nav-item span,
.app.collapsed #admin-sidebar .nav-item .soon,
.app.collapsed #admin-sidebar .logout span {
  display: none;
}

.app.collapsed #admin-sidebar .sidebar-collapse svg {
  transform: rotate(180deg);
}

.app.collapsed #admin-sidebar .nav {
  padding-right: 10px;
  padding-left: 10px;
}

.app.collapsed #admin-sidebar .nav-item {
  justify-content: center;
  padding-right: 0;
  padding-left: 0;
}

.app.collapsed #admin-sidebar .nav-item.active {
  box-shadow: inset 3px 0 0 var(--sb-sage);
}

.app.collapsed #admin-sidebar .side-bottom {
  padding-right: 14px;
  padding-left: 14px;
}

.app.collapsed #admin-sidebar .logout {
  padding-right: 0;
  padding-left: 0;
}

.app.collapsed .main {
  width: calc(100% - 80px);
  margin-left: 80px;
}

#admin-sidebar svg {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Navigation */
#admin-sidebar .nav {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px 20px;
  scrollbar-width: thin;
  scrollbar-color: rgb(130 164 134 / 25%) transparent;
}

#admin-sidebar .nav-label {
  margin: 0;
  padding: 20px 13px 9px;
  color: var(--sb-muted);
  font: 600 10px Inter, Arial, sans-serif;
  letter-spacing: 1.7px;
  text-transform: uppercase;
}

#admin-sidebar .nav-item {
  position: relative;
  display: flex;
  width: 100%;
  min-height: 43px;
  align-items: center;
  gap: 12px;
  margin: 0 0 4px;
  padding: 10px 13px;
  color: var(--sb-muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 10px;
  font: 500 13px Inter, Arial, sans-serif;
  text-align: left;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  transition: color 0.18s, background 0.18s, border-color 0.18s, transform 0.18s;
}

#admin-sidebar .nav-item:not(:disabled):hover {
  color: var(--sb-text);
  background: var(--sb-hover);
  transform: translateX(2px);
}

#admin-sidebar .nav-item.active {
  color: var(--sb-text);
  font-weight: 600;
  background: var(--sb-active);
  border-color: rgb(130 164 134 / 14%);
  box-shadow: inset 3px 0 0 var(--sb-sage);
}

#admin-sidebar .nav-item.active svg {
  color: var(--sb-sage);
}

#admin-sidebar .nav-item span {
  overflow: hidden;
  text-overflow: ellipsis;
}

#admin-sidebar .nav-item:disabled {
  opacity: 0.48;
  cursor: not-allowed;
}

#admin-sidebar .soon {
  margin-left: auto;
  padding: 2px 7px;
  color: var(--sb-muted);
  border: 1px solid var(--sb-border);
  border-radius: 999px;
  font: 500 9px Inter, Arial, sans-serif;
  font-style: normal;
  line-height: 1.4;
}

/* Logout: no profile/name block */
#admin-sidebar .side-bottom {
  padding: 18px 20px 22px;
  border-top: 1px solid var(--sb-border);
}

#admin-sidebar .logout {
  display: flex;
  width: 100%;
  min-height: 43px;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 10px 16px;
  color: var(--sb-action-text);
  background: var(--sb-sage);
  border: 1px solid color-mix(in oklab, var(--sb-sage) 70%, var(--sb-border));
  border-radius: 10px;
  box-shadow: 0 7px 18px rgb(4 16 10 / 16%);
  font: 600 13px Inter, Arial, sans-serif;
  cursor: pointer;
  transition: background 0.18s, transform 0.18s, box-shadow 0.18s;
}

#admin-sidebar .logout:hover {
  filter: brightness(1.08);
  box-shadow: 0 9px 22px rgb(4 16 10 / 22%);
  transform: translateY(-1px);
}

#admin-sidebar .logout svg {
  width: 16px;
  height: 16px;
}

#admin-sidebar a:focus-visible,
#admin-sidebar button:focus-visible {
  outline: 2px solid var(--sb-sage);
  outline-offset: 2px;
}

/* Helpers used by the admin pages */
.mobile-overlay,
.mobile-collapse {
  display: none;
}

.theme-toggle .theme-icon {
  display: block;
  width: 20px;
  height: 20px;
}

.notification-bell {
  width: 34px;
  height: 34px;
  align-items: center;
  justify-content: center;
}

.notification-bell svg {
  width: 18px;
  height: 18px;
}

/* Mobile navigation is opened by the page's mobile menu button */
@media (max-width: 800px) {
  #admin-sidebar {
    width: min(278px, calc(100vw - 48px));
    transform: translateX(-100%);
    transition: transform 0.22s ease;
  }

  .app.collapsed #admin-sidebar {
    width: min(278px, calc(100vw - 48px));
  }

  .app.collapsed #admin-sidebar .brand {
    justify-content: flex-start;
    padding: 0 26px 0 22px;
  }

  .app.collapsed #admin-sidebar .brand-logo {
    width: 48px;
    height: 48px;
    flex-basis: 48px;
  }

  .app.collapsed #admin-sidebar .brand-name,
  .app.collapsed #admin-sidebar .nav-label,
  .app.collapsed #admin-sidebar .nav-item span,
  .app.collapsed #admin-sidebar .nav-item .soon,
  .app.collapsed #admin-sidebar .logout span {
    display: initial;
  }

  .app.collapsed #admin-sidebar .nav {
    padding-right: 14px;
    padding-left: 14px;
  }

  .app.collapsed #admin-sidebar .nav-item {
    justify-content: flex-start;
    padding: 10px 13px;
  }

  .app.collapsed #admin-sidebar .side-bottom {
    padding: 18px 20px 22px;
  }

  .app.collapsed #admin-sidebar .logout {
    padding: 10px 16px;
  }

  .app.collapsed .main {
    width: 100%;
    margin-left: 0;
  }

  .app > .main {
    width: 100%;
    margin-left: 0;
  }

  .app.mobile-open #admin-sidebar {
    transform: translateX(0);
    box-shadow: 0 0 44px rgb(0 0 0 / 35%);
  }

  .app.mobile-open .mobile-overlay {
    position: fixed;
    inset: 0;
    z-index: 19;
    display: block;
    background: rgb(5 15 10 / 58%);
    border: 0;
    backdrop-filter: blur(2px);
  }

  .mobile-collapse {
    display: flex;
  }
}

@media (prefers-reduced-motion: reduce) {
  #admin-sidebar,
  #admin-sidebar * {
    transition: none !important;
  }
}
</style>
