.materials-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.materials-heading .view-title{margin-bottom:0}.material-filters{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.material-filters label{color:var(--muted);font-size:11px}.material-filters .period{font-size:11px;max-width:200px}.library-material{overflow:hidden}.material-media{aspect-ratio:4/3;background:var(--shade);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted)}.material-media>svg{width:42px;height:42px}.material-media img{width:100%;height:100%;object-fit:contain}.material-media img[hidden],.material-detail-media img[hidden]{display:none}.material-image-fallback{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted)}.material-image-fallback[hidden]{display:none}.material-body{padding:20px}.material-body h2{font:22px var(--font-title);margin:14px 0 10px;overflow-wrap:anywhere}.material-body p{font-size:12px;line-height:1.7;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:61px;overflow-wrap:anywhere}.material-body .material-bottom{gap:8px}.material-body .material-bottom>div{display:flex}.material-empty{padding:60px 18px;text-align:center;border-block:1px solid var(--border);color:var(--muted)}.material-empty>svg{width:36px;height:36px;color:var(--sage)}.material-empty h2{font:22px var(--font-title);color:var(--text)}.material-detail-media{aspect-ratio:4/3;background:var(--shade);display:flex;align-items:center;justify-content:center}.material-detail-media img{width:100%;height:100%;object-fit:contain}.material-error{color:var(--coral);line-height:1.6;margin:0}.material-error[hidden]{display:none}
:focus-visible {outline:2px solid var(--sage);outline-offset:3px}
.evaluation-heading,.logs-heading{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:24px 0 16px}.evaluation-heading h2,.logs-heading h2{font-size:13px;font-weight:550;margin:0}.logs-heading p{color:var(--muted);font-size:11px;margin:7px 0 0}.evaluation-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.evaluation{padding:22px}.evaluation p,.evaluation-note{color:var(--muted);font-size:11px;line-height:1.7}.evaluation-meta{display:flex;justify-content:space-between;gap:12px;margin-top:14px;color:var(--muted);font-size:10px}.evaluation-note{margin:16px 0 30px}.log-controls{display:flex;align-items:center;gap:16px}.log-time{display:block;color:var(--muted);font-size:9px;margin-top:6px}.log-pagination{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;color:var(--muted);font-size:10px}.log-pagination>div{display:flex;gap:12px;align-items:center}.previous-arrow{transform:rotate(180deg)}button:disabled{opacity:.35;cursor:default}.log-details{margin:0;grid-column:1/-1}.log-details>div{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid var(--border);padding:12px 0}.log-details dt{color:var(--muted)}.log-details dd{margin:0;text-align:right;overflow-wrap:anywhere}.detail-note{color:var(--muted);font-size:11px;line-height:1.7;grid-column:1/-1}.form-actions[hidden]{display:none}
@media(max-width:600px){.evaluation-grid{grid-template-columns:1fr}.evaluation-meta{flex-wrap:wrap}.log-pagination{flex-wrap:wrap}.logs-heading .badge{white-space:normal}.header-title{max-width:135px;line-height:1.4}.log-controls{flex-wrap:wrap}}
@media(max-width:430px){header{padding:0 14px;gap:8px}.header-right{gap:8px}.search{width:112px}.theme-toggle{width:34px;height:34px}.toast{left:14px;right:14px;bottom:18px}}

:root{--parchment:oklch(0.93 0.035 85);--parchment-deep:oklch(0.84 0.055 75);--parchment-edge:oklch(0.62 0.07 60);--ink:oklch(0.33 0.04 55);--ink-soft:oklch(0.44 0.05 55);--roller:oklch(0.66 0.08 62);--roller-dark:oklch(0.48 0.07 55);--paper-shadow:0 14px 28px oklch(0.3 0.04 60 / .18)}
:root[data-theme="dark"]{--parchment:oklch(0.8 0.045 80);--parchment-deep:oklch(0.7 0.06 70);--parchment-edge:oklch(0.48 0.06 55);--ink:oklch(0.27 0.035 55);--ink-soft:oklch(0.34 0.045 55);--roller:oklch(0.55 0.07 60);--roller-dark:oklch(0.38 0.05 55);--paper-shadow:0 16px 34px oklch(0.08 0.02 160 / .55)}
:root[data-theme="dark"] .leaf-card{filter:drop-shadow(0 12px 18px oklch(0.08 0.02 160 / .55)) drop-shadow(0 0 2px oklch(0.25 0.03 55 / .85))}
.system[data-state="error"] .dot{background:var(--coral)}.system[data-state="loading"] .dot{background:var(--amber)}
.scroll-hero{display:flex;align-items:stretch;margin:6px 0 34px;filter:drop-shadow(var(--paper-shadow))}
.roller{flex:0 0 30px;border-radius:14px;margin:-12px 0;background:linear-gradient(90deg,var(--roller-dark),var(--roller) 35%,var(--parchment) 55%,var(--roller) 75%,var(--roller-dark));position:relative}
.roller::before,.roller::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:16px;height:14px;border-radius:5px;background:var(--roller-dark)}.roller::before{top:-10px}.roller::after{bottom:-10px}
.scroll-paper{flex:1;padding:38px 48px;color:var(--ink);background:radial-gradient(ellipse at 50% 45%,var(--parchment) 40%,var(--parchment-deep) 100%);clip-path:polygon(0 3%,6% 0,13% 2.5%,22% .5%,31% 3%,40% 1%,50% 3.5%,61% .5%,70% 2.5%,81% 0,90% 3%,100% 1%,100% 98%,92% 100%,83% 97%,72% 99.5%,62% 97%,51% 100%,40% 97.5%,29% 99.5%,18% 97%,9% 100%,0 97%)}
.scroll-paper .eyebrow{color:var(--ink-soft)}.scroll-paper h1{font-family:var(--font-title);font-weight:500;font-size:clamp(28px,4vw,42px);margin:10px 0 8px;color:var(--ink)}.scroll-paper p{color:var(--ink-soft);margin:0 0 18px;max-width:520px}
.scroll-date{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-soft);border-top:1px dashed var(--parchment-edge);padding-top:12px}.scroll-date svg,.scroll-paper .eyebrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}
.overview-section-heading{display:flex;align-items:center;gap:18px;margin:0 0 22px;color:var(--text)}
.overview-section-heading h2{margin:0;font:500 24px var(--font-title);letter-spacing:-.01em;white-space:nowrap}
.overview-section-heading::after{content:"";height:1px;flex:1;background:var(--border)}
.leaf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-bottom:38px}
.leaf-card{position:relative;min-width:0;filter:drop-shadow(0 12px 18px oklch(0.3 0.04 60 / .26))}

.leaf-label{font-size:10.5px;font-weight:600;letter-spacing:.085em;line-height:1.25;text-transform:uppercase;color:var(--ink-soft)}
.leaf-value{font-family:var(--font-title);font-weight:500;font-size:clamp(22px,2.3vw,32px);line-height:1.1;color:var(--ink);overflow-wrap:anywhere}
.leaf-card:nth-child(3) .leaf-value{font-size:clamp(18px,1.65vw,24px);white-space:nowrap}
.leaf-note{font-size:11px;line-height:1.3;color:var(--ink-soft);overflow-wrap:anywhere}
.paper-columns{display:grid;grid-template-columns:1.5fr 1fr;gap:26px;margin-bottom:28px}.paper-columns.single{grid-template-columns:1fr}
.parchment-panel{position:relative;padding:26px 28px;color:var(--ink);background:radial-gradient(ellipse at 50% 30%,var(--parchment) 45%,var(--parchment-deep) 110%);border-radius:4px;box-shadow:var(--paper-shadow),inset 0 0 40px oklch(0.55 0.07 60 / .22)}
.parchment-panel .panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.parchment-panel h3{font-family:var(--font-title);font-weight:500;font-size:20px;margin:0}.parchment-panel p{margin:4px 0 0;color:var(--ink-soft);font-size:13px}
.parchment-panel .period{background:transparent;color:var(--ink);border:1px solid var(--parchment-edge)}
.ink-chart{display:flex;align-items:flex-end;gap:6px;height:200px;border-bottom:1px solid var(--parchment-edge);padding-bottom:4px}
.ink-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}.ink-stack{flex:1;width:100%;max-width:34px;display:flex;flex-direction:column-reverse;justify-content:flex-start}
.ink-bar{display:block;width:100%}.ink-bar.a{background:var(--sage);border-radius:3px 3px 0 0}.ink-bar.b{background:var(--tan)}.ink-col small{font-size:11px;color:var(--ink-soft);margin-top:6px;white-space:nowrap;height:14px}
.ink-legend{display:flex;gap:18px;margin-top:12px;font-size:12px;color:var(--ink-soft)}.ink-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}.ink-legend i.a{background:var(--sage)}.ink-legend i.b{background:var(--tan)}
.note-list{list-style:none;margin:0;padding:0}.note-list li{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--parchment-edge)}.note-list li:last-child{border-bottom:0}
.note-list strong{display:block;font-weight:600}.note-list small{display:block;color:var(--ink-soft);font-size:12.5px;margin-top:3px;overflow-wrap:anywhere}.stars{color:var(--roller-dark);font-weight:400;letter-spacing:1px}
.seal{flex:0 0 auto;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--parchment-edge);color:var(--parchment);text-transform:capitalize}.seal.soft{background:transparent;color:var(--ink-soft);border:1px solid var(--parchment-edge)}
.text-link{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
.paper-empty{color:var(--ink-soft);font-style:italic;padding:20px 0}
