<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signrest — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text-primary: #1c311e;
      --text-muted: #3c543e;
      --brand-color: #1c311e;
      --veil-bg: rgba(226, 238, 222, 0.28);
      --drawer-bg: rgba(216, 225, 206, 0.86);
      --drawer-border: rgba(44, 74, 44, 0.22);
      --arrow-accent: #82a343;
      --circle-sage: #e4ead9;
      --circle-olive: #7b9647;
      --circle-forest: #3d5d3f;
    }

    body.dark-mode {
      --text-primary: #eef4ec;
      --text-muted: #b8c9b8;
      --brand-color: #e4f3e2;
      --veil-bg: rgba(11, 20, 16, 0.56);
      --drawer-bg: rgba(22, 36, 27, 0.9);
      --drawer-border: rgba(175, 212, 175, 0.22);
      --arrow-accent: #9ec458;
      --circle-sage: #2b4232;
      --circle-olive: #688238;
      --circle-forest: #2e4b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      font-family: 'Lora', Georgia, serif;
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .bg-photo-layer {
      position: fixed;
      inset: -20px;
      z-index: 0;
      background-size: cover;
      background-position: center;
      filter: blur(5px);
      transform: scale(1.03);
      transition: background-image 0.45s ease;
    }

    .bg-veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: var(--veil-bg);
      pointer-events: none;
      transition: background 0.35s ease;
    }

    #cursorEffectCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .main-dashboard {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .dashboard-topbar {
      height: 68px;
      padding: 10px 26px 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--brand-color);
    }

    .brand-logo-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(44, 74, 44, 0.35);
    }

    .brand-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .profile-trigger-btn {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 9999px;
      border: 2px solid rgba(44, 74, 44, 0.45);
      background: var(--circle-sage);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(15, 28, 16, 0.18);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .profile-trigger-btn:hover {
      transform: scale(1.07);
      box-shadow: 0 8px 22px rgba(15, 28, 16, 0.26);
    }

    .profile-trigger-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .right-floating-dock {
      position: fixed;
      bottom: 8px;
      right: 34px;
      z-index: 55;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 11px;
    }

    .dock-circle-btn {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(14, 28, 16, 0.22);
      transition: transform 0.22s cubic-bezier(0.22, 1.28, 0.36, 1), box-shadow 0.2s ease, outline 0.15s ease;
    }

    .dock-circle-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 20px rgba(14, 28, 16, 0.28);
    }

    .dock-circle-btn.active {
      outline: 2.5px solid #ffffff;
      outline-offset: 2px;
      transform: scale(1.06);
    }

    .dock-theme-circle {
      background-color: #e4ead9;
      color: #1c311e;
      border: 1.5px solid rgba(44, 74, 44, 0.28);
    }

    .dock-noti-circle {
      background-color: #e4ead9;
      color: #f59e0b;
      border: 1.5px solid rgba(44, 74, 44, 0.28);
    }

    .dock-donation-circle {
      background-color: #7b9647;
      color: #ffffff;
      overflow: hidden;
    }

    .dock-learning-circle {
      background-color: #3d5d3f;
      color: #ffffff;
    }

    body.dark-mode .dock-theme-circle,
    body.dark-mode .dock-noti-circle {
      background-color: #2b4232;
      border-color: rgba(175, 212, 175, 0.28);
    }

    body.dark-mode .dock-theme-circle {
      color: #eef4ec;
    }

    body.dark-mode .dock-donation-circle {
      background-color: #688238;
    }

    body.dark-mode .dock-learning-circle {
      background-color: #2e4b30;
    }

    .dock-circle-btn svg {
      width: 20px;
      height: 20px;
    }

    .dock-circle-btn img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .dock-donation-circle img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 50%;
    }

    .noti-badge-dot {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9f2323;
      border: 1.5px solid #ffffff;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(12, 22, 14, 0.12);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .profile-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 245px;
      z-index: 48;
      background: var(--drawer-bg);
      border-left: 1px solid var(--drawer-border);
      backdrop-filter: blur(14px);
      box-shadow: -12px 0 32px rgba(12, 24, 14, 0.16);
      padding: 14px 18px 24px 18px;
      display: flex;
      flex-direction: column;
      transform: translateX(105%);
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .profile-drawer.open {
      transform: translateX(0);
    }

    .drawer-plant-stage {
      position: absolute;
      top: 0;
      right: 0;
      width: 122px;
      height: 155px;
      z-index: 3;
      cursor: pointer;
    }

    .drawer-branch-stick {
      position: absolute;
      top: 10px;
      right: 0;
      width: 96px;
      height: 2px;
      background: linear-gradient(90deg, #4b5d3b 0%, #5c4632 55%, #3d2e20 100%);
      border-radius: 2px 0 0 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
      pointer-events: none;
    }

    .drawer-branch-stick::before {
      content: "";
      position: absolute;
      left: 14px;
      top: -3px;
      width: 14px;
      height: 1.5px;
      background: #4b5d3b;
      transform: rotate(-24deg);
      transform-origin: right center;
      border-radius: 2px;
    }

    .drawer-hanging-plant {
      position: absolute;
      top: 4px;
      right: -4px;
      width: 112px;
      height: auto;
      user-select: none;
      transform-origin: 50% 6px;
      filter: drop-shadow(0 6px 12px rgba(15, 28, 16, 0.18));
      transition: transform 0.6s ease;
    }

    @keyframes gentleBreezeSway {
      0%   { transform: rotate(0deg); }
      25%  { transform: rotate(3.4deg); }
      50%  { transform: rotate(-2.2deg); }
      75%  { transform: rotate(2.6deg); }
      100% { transform: rotate(0deg); }
    }

    .drawer-plant-stage:hover .drawer-hanging-plant {
      animation: gentleBreezeSway 4.6s ease-in-out infinite;
    }

    .drawer-user-header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 26px;
      padding-right: 76px;
    }

    .drawer-avatar-ring {
      width: 52px;
      height: 52px;
      border-radius: 9999px;
      border: 2px solid rgba(44, 74, 44, 0.45);
      background: var(--circle-sage);
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .drawer-avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .drawer-username {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-primary);
      word-break: break-word;
    }

    .drawer-arrow-nav {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-top: 6px;
      padding-right: 12px;
    }

    .drawer-arrow-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      padding: 4px 2px;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .drawer-arrow-link .chevron-arrow {
      color: var(--arrow-accent);
      flex-shrink: 0;
      transition: transform 0.22s ease;
    }

    .drawer-arrow-link:hover {
      transform: translateX(-4px);
    }

    .drawer-arrow-link:hover .chevron-arrow {
      transform: translateX(-3px) scale(1.12);
    }

    .drawer-footer {
      margin-top: auto;
      width: 100%;
      padding-bottom: 44px;
    }

    .drawer-logout-btn {
      display: block;
      width: 100%;
      background: #28462c;
      border: 1px solid #1e3522;
      color: #ffffff;
      border-radius: 8px;
      padding: 10px 16px;
      font-family: 'Lora', Georgia, serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(15, 30, 18, 0.18);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    body.dark-mode .drawer-logout-btn {
      background: #3d6b43;
      border-color: #558a5c;
      color: #ffffff;
    }

    .drawer-logout-btn:hover {
      background: #1e3522;
      transform: translateY(-1px);
    }

    .pages-stage {
      flex: 1;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 2px 28px 66px 28px;
      position: relative;
      z-index: 10;
    }

    @keyframes expandFromArrowHead {
      0% {
        clip-path: circle(0px at var(--origin-x, 88%) var(--origin-y, 26%));
        opacity: 0.25;
      }
      100% {
        clip-path: circle(150% at var(--origin-x, 88%) var(--origin-y, 26%));
        opacity: 1;
      }
    }

    .pages-stage.arrow-expanding {
      animation: expandFromArrowHead 0.56s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @media (max-width: 768px) {
      .pages-stage {
        padding: 4px 16px 68px 16px;
      }
      .right-floating-dock {
        right: 34px;
        bottom: 8px;
        gap: 11px;
      }
    }
  </style>
</head>
<body>

  <div id="bgPhotoLayer" class="bg-photo-layer"></div>
  <div class="bg-veil"></div>

  <canvas id="cursorEffectCanvas" aria-hidden="true"></canvas>

  <div class="main-dashboard" id="mainDashboard">

    <header class="dashboard-topbar">
      <a href="/home?page=translation" class="brand-link" data-page-link="translation">
        <img id="brandLogoImg" class="brand-logo-img" alt="Signrest Logo" />
        <span class="brand-name">Signrest</span>
      </a>

      <button
        type="button"
        id="profileSlotBtn"
        class="profile-trigger-btn"
        aria-label="Open Profile Menu"
        title="Profile & Settings"
      >
        <span id="profileInitialText" style="font-weight:700; font-size:1.05rem;">U</span>
        <img id="profileAvatarImg" style="display:none;" alt="User Profile Photo" />
      </button>
    </header>

    <div class="right-floating-dock" aria-label="Quick Actions">
      <button
        type="button"
        id="themeSlotBtn"
        class="dock-circle-btn dock-theme-circle"
        aria-label="Toggle Light or Dark Mode"
        title="Light / Dark Mode"
      >
        <img id="themeIconImg" alt="Theme Toggle" />
      </button>

      <button
        type="button"
        class="dock-circle-btn dock-noti-circle"
        data-page-link="notification"
        aria-label="Notifications"
        title="Notifications"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" />
        </svg>
        <span class="noti-badge-dot" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="dock-circle-btn dock-donation-circle"
        data-page-link="donation"
        aria-label="Donation"
        title="Support & Donation"
      >
        <img id="donationIconImg" alt="Donation" />
      </button>

      <button
        type="button"
        class="dock-circle-btn dock-learning-circle"
        data-page-link="learning"
        aria-label="Learning"
        title="ASL Learning"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
        </svg>
      </button>
    </div>

    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    <div id="sidebarMount"></div>

    <main class="pages-stage" id="pagesContainer">
      <p style="text-align:center; padding:40px 0;">Loading Signrest...</p>
    </main>

  </div>

  <script>
    const DASHBOARD_ASSETS = {
      logo:     "../assets/images/logo.png",
      bgLight:  "../assets/images/login_bg_11.jpg",
      bgDark:   "../assets/images/login_bg_night_1.jpg",
      iconSun:  "../assets/images/sun_bgremove.png",
      iconMoon: "../assets/images/moon_bgremove.png",
      donation: "../assets/images/donation.png"
    };

    const DASHBOARD_FALLBACKS = {
      logo:     "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='#3e5d3e'/><path d='M20 40 C20 26, 34 18, 46 20 C44 33, 35 43, 20 40 Z' fill='#b9e396'/></svg>`),
      iconSun:  "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='#f59e0b' stroke='#f59e0b' stroke-width='2'><circle cx='12' cy='12' r='5'/></svg>`),
      iconMoon: "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='#e2e8f0'><path d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'/></svg>`),
      donation: "../assets/images/donation.jpg"
    };

    const PAGE_ROUTES = {
      translation:  "/user_homepage/translation.html",
      learning:     "/user_homepage/learning.html",
      notification: "/user_homepage/notification.html",
      donation:     "/user_homepage/donation.html",
      profile:      "/user_homepage/profile.html",
      cursor:       "/user_homepage/cursor_setting.html",
      contact:      "/user_homepage/contact.html",
      feedback:     "/user_homepage/feedback.html"
    };

    let currentTheme = localStorage.getItem("signrest_theme") === "dark" ? "dark" : "light";
    let currentUserData = { username: "User", profile_photo: null };

    const bgPhotoLayer = document.getElementById("bgPhotoLayer");
    const brandLogoImg = document.getElementById("brandLogoImg");
    const themeIconImg = document.getElementById("themeIconImg");
    const donationIconImg = document.getElementById("donationIconImg");
    const sidebarMount = document.getElementById("sidebarMount");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const pagesContainer = document.getElementById("pagesContainer");
    const profileSlotBtn = document.getElementById("profileSlotBtn");

    function applyDashboardTheme() {
      const isDark = currentTheme === "dark";
      document.body.classList.toggle("dark-mode", isDark);
      document.documentElement.setAttribute("data-theme", currentTheme);
      localStorage.setItem("signrest_theme", currentTheme);

      brandLogoImg.onerror = () => {
        brandLogoImg.onerror = null;
        brandLogoImg.src = DASHBOARD_FALLBACKS.logo;
      };
      brandLogoImg.src = DASHBOARD_ASSETS.logo;

      const iconKey = isDark ? "iconMoon" : "iconSun";
      themeIconImg.onerror = () => {
        themeIconImg.onerror = null;
        themeIconImg.src = DASHBOARD_FALLBACKS[iconKey];
      };
      themeIconImg.src = DASHBOARD_ASSETS[iconKey];

      donationIconImg.onerror = () => {
        donationIconImg.onerror = null;
        donationIconImg.src = DASHBOARD_FALLBACKS.donation;
      };
      donationIconImg.src = DASHBOARD_ASSETS.donation;

      bgPhotoLayer.style.backgroundImage = `url('${isDark ? DASHBOARD_ASSETS.bgDark : DASHBOARD_ASSETS.bgLight}')`;
    }

    document.getElementById("themeSlotBtn").addEventListener("click", () => {
      currentTheme = currentTheme === "light" ? "dark" : "light";
      applyDashboardTheme();
    });

    function syncUserIdentityUI() {
      const name = currentUserData.username || "User";
      const photo = currentUserData.profile_photo;
      const initial = name.trim().charAt(0).toUpperCase();

      const topInitial = document.getElementById("profileInitialText");
      const topAvatar = document.getElementById("profileAvatarImg");
      if (topInitial) topInitial.textContent = initial;
      if (topAvatar && photo) {
        topAvatar.src = photo;
        topAvatar.style.display = "block";
        if (topInitial) topInitial.style.display = "none";
      }

      const drawerName = document.getElementById("drawerUsernameText");
      const drawerInitial = document.getElementById("drawerInitialText");
      const drawerAvatar = document.getElementById("drawerAvatarImg");
      if (drawerName) drawerName.textContent = name;
      if (drawerInitial) drawerInitial.textContent = initial;
      if (drawerAvatar && photo) {
        drawerAvatar.src = photo;
        drawerAvatar.style.display = "block";
        if (drawerInitial) drawerInitial.style.display = "none";
      }
    }

    async function loadUserFromDatabase() {
      try {
        const res = await fetch("/api/user/me");
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.authenticated) {
          currentUserData = {
            username: data.username || "User",
            profile_photo: data.profile_photo || null
          };
          syncUserIdentityUI();
        }
      } catch (err) {}
    }

    /* =========================================================
       CLOUDINARY CURSOR EFFECT ENGINE (TRAIL + SINGLE POP BURST)
       ========================================================= */
    const cursorCanvas = document.getElementById("cursorEffectCanvas");
    const cursorCtx = cursorCanvas.getContext("2d");
    const loadedEffectImages = {};
    let activeTrailEffect = null;
    let activeClickEffect = null;
    let cursorParticles = [];
    let cursorAnimId = null;
    let lastTrailTime = 0;
    let lastTrailX = -9999;
    let lastTrailY = -9999;

    function resizeCursorCanvas() {
      cursorCanvas.width = window.innerWidth;
      cursorCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCursorCanvas);
    resizeCursorCanvas();

    function getCachedEffectImage(url) {
      if (!url) return null;
      if (!loadedEffectImages[url]) {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = url;
        loadedEffectImages[url] = img;
      }
      const cached = loadedEffectImages[url];
      return cached.complete && cached.naturalWidth > 0 ? cached : null;
    }

    window.setSignrestCursorEffects = function (trailObj, clickObj) {
      activeTrailEffect = trailObj && trailObj.effect_path ? trailObj : null;
      activeClickEffect = clickObj && clickObj.effect_path ? clickObj : null;
      if (activeTrailEffect) getCachedEffectImage(activeTrailEffect.effect_path);
      if (activeClickEffect) getCachedEffectImage(activeClickEffect.effect_path);
    };

    async function loadUserCursorEffects() {
      try {
        const res = await fetch("/api/cursor-effects");
        if (!res.ok) return;
        const data = await res.json();
        window.setSignrestCursorEffects(data.trail_effect, data.click_effect);
      } catch (err) {}
    }

    function startCursorLoop() {
      if (!cursorAnimId) {
        cursorAnimId = requestAnimationFrame(renderCursorParticles);
      }
    }

    function renderCursorParticles() {
      cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);

      for (let i = cursorParticles.length - 1; i >= 0; i--) {
        const p = cursorParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.vRot;
        p.alpha -= p.decay;

        if (p.isPop) {
          p.progress = Math.min(1, p.progress + 0.065);
          p.scale = p.progress < 0.45
            ? 0.35 + (p.progress / 0.45) * 0.9
            : 1.25 - ((p.progress - 0.45) / 0.55) * 0.2;
        }

        if (p.alpha <= 0) {
          cursorParticles.splice(i, 1);
          continue;
        }

        const img = getCachedEffectImage(p.url);
        if (!img) continue;

        const scale = p.scale || 1;
        const aspect = img.naturalHeight / img.naturalWidth;
        const drawW = p.size * scale;
        const drawH = p.size * aspect * scale;

        cursorCtx.save();
        cursorCtx.globalAlpha = Math.max(0, p.alpha);
        cursorCtx.translate(p.x, p.y);
        cursorCtx.rotate(p.rotation);
        cursorCtx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
        cursorCtx.restore();
      }

      if (cursorParticles.length > 0) {
        cursorAnimId = requestAnimationFrame(renderCursorParticles);
      } else {
        cursorAnimId = null;
      }
    }

    window.addEventListener("mousemove", (e) => {
      if (!activeTrailEffect) return;
      if (document.getElementById("cursorSettingRoot")) return;

      const now = performance.now();
      const dist = Math.hypot(e.clientX - lastTrailX, e.clientY - lastTrailY);
      if (now - lastTrailTime < 115 || dist < 26) return;

      lastTrailTime = now;
      lastTrailX = e.clientX;
      lastTrailY = e.clientY;

      cursorParticles.push({
        url: activeTrailEffect.effect_path,
        x: e.clientX,
        y: e.clientY,
        vx: (Math.random() - 0.5) * 0.35,
        vy: -0.35 - Math.random() * 0.35,
        size: activeTrailEffect.size || 24,
        rotation: (Math.random() - 0.5) * 0.35,
        vRot: (Math.random() - 0.5) * 0.015,
        alpha: 0.9,
        decay: 0.015
      });
      startCursorLoop();
    });

    window.addEventListener("mousedown", (e) => {
      if (!activeClickEffect) return;
      if (document.getElementById("cursorSettingRoot")) return;

      cursorParticles.push({
        url: activeClickEffect.effect_path,
        x: e.clientX,
        y: e.clientY,
        vx: 0,
        vy: -0.25,
        size: activeClickEffect.size || 26,
        isPop: true,
        progress: 0,
        scale: 0.35,
        rotation: (Math.random() - 0.5) * 0.25,
        vRot: 0,
        alpha: 1,
        decay: 0.024
      });
      startCursorLoop();
    });

    /* =========================================================
       DRAWER & PAGE NAVIGATION
       ========================================================= */
    function openProfileDrawer() {
      const drawer = document.getElementById("profileDrawer");
      if (!drawer) return;
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      drawerBackdrop.classList.add("open");
    }

    function closeProfileDrawer() {
      const drawer = document.getElementById("profileDrawer");
      if (!drawer) return;
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      drawerBackdrop.classList.remove("open");
    }

    profileSlotBtn.addEventListener("click", () => {
      const drawer = document.getElementById("profileDrawer");
      if (drawer && drawer.classList.contains("open")) {
        closeProfileDrawer();
      } else {
        openProfileDrawer();
      }
    });

    drawerBackdrop.addEventListener("click", closeProfileDrawer);

    function getCurrentPageKey() {
      const params = new URLSearchParams(window.location.search);
      const key = (params.get("page") || "translation").toLowerCase();
      return PAGE_ROUTES[key] ? key : "translation";
    }

    function setActiveDockCircle(pageKey) {
      document.querySelectorAll(".dock-circle-btn[data-page-link]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.pageLink === pageKey);
      });
    }

    function navigateToPage(targetPage, expandOriginEvent) {
      if (!PAGE_ROUTES[targetPage]) return;

      if (expandOriginEvent && expandOriginEvent.currentTarget) {
        const arrowEl = expandOriginEvent.currentTarget.querySelector(".chevron-arrow") || expandOriginEvent.currentTarget;
        const rect = arrowEl.getBoundingClientRect();
        const originX = Math.round(rect.left + rect.width / 2);
        const originY = Math.round(rect.top + rect.height / 2);
        pagesContainer.style.setProperty("--origin-x", `${originX}px`);
        pagesContainer.style.setProperty("--origin-y", `${originY}px`);
      } else {
        pagesContainer.style.removeProperty("--origin-x");
        pagesContainer.style.removeProperty("--origin-y");
      }

      closeProfileDrawer();
      window.history.pushState({ page: targetPage }, "", `/home?page=${targetPage}`);
      loadPage(targetPage, Boolean(expandOriginEvent));
    }

    async function loadProfileDrawer() {
      const res = await fetch("/user_homepage/sidebar.html");
      sidebarMount.innerHTML = await res.text();
      syncUserIdentityUI();

      const closeAvatarBtn = document.getElementById("drawerAvatarCloseBtn");
      if (closeAvatarBtn) {
        closeAvatarBtn.addEventListener("click", closeProfileDrawer);
      }

      document.querySelectorAll("#sidebarMount .drawer-arrow-link[data-page]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          navigateToPage(btn.dataset.page, e);
        });
      });

      const logoutBtn = document.getElementById("sidebarLogoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          await fetch("/api/logout", { method: "POST" });
          window.location.href = "/login";
        });
      }
    }

    document.querySelectorAll("[data-page-link]").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        navigateToPage(el.dataset.pageLink, e);
      });
    });

    async function loadPage(pageKey, triggerArrowExpand) {
      setActiveDockCircle(pageKey);
      const fileUrl = PAGE_ROUTES[pageKey];

      try {
        const res = await fetch(fileUrl);
        if (!res.ok) {
          pagesContainer.innerHTML = `
            <div style="background:rgba(242,245,236,0.9); border-radius:20px; padding:28px; max-width:680px; margin:24px auto;">
              <h2 style="margin-bottom:8px; text-transform:capitalize;">${pageKey.replace("_", " ")}</h2>
              <p>This page (<code>Front-end${fileUrl}</code>) will be built next.</p>
            </div>`;
        } else {
          const html = await res.text();
          const parsed = new DOMParser().parseFromString(html, "text/html");

          pagesContainer.innerHTML = "";
          parsed.querySelectorAll("style").forEach((styleTag) => {
            pagesContainer.appendChild(styleTag.cloneNode(true));
          });

          const translateRoot = parsed.getElementById("translatePageRoot");
          const pageRoot =
            translateRoot ||
            parsed.getElementById("cursorSettingRoot") ||
            parsed.getElementById("learningPageRoot") ||
            parsed.body;
          if (translateRoot) {
            const translatedPage = translateRoot.cloneNode(true);
            translatedPage.querySelectorAll("script").forEach((script) => script.remove());
            pagesContainer.appendChild(translatedPage);
          } else {
            Array.from(pageRoot.children).forEach((child) => {
              if (child.tagName !== "SCRIPT") {
                pagesContainer.appendChild(child.cloneNode(true));
              }
            });
          }

          const scripts = Array.from(parsed.querySelectorAll("script"));
          for (const oldScript of scripts) {
            await new Promise((resolve) => {
              const newScript = document.createElement("script");
              if (oldScript.src) {
                newScript.src = oldScript.src;
                newScript.onload = resolve;
                newScript.onerror = resolve;
              } else {
                newScript.textContent = oldScript.textContent;
                resolve();
              }
              document.body.appendChild(newScript);
            });
          }
        }

        if (triggerArrowExpand) {
          pagesContainer.classList.remove("arrow-expanding");
          pagesContainer.style.clipPath = "";
          void pagesContainer.offsetWidth;
          pagesContainer.classList.add("arrow-expanding");
          pagesContainer.addEventListener(
            "animationend",
            () => {
              pagesContainer.classList.remove("arrow-expanding");
              pagesContainer.style.clipPath = "none";
            },
            { once: true }
          );
        } else {
          pagesContainer.classList.remove("arrow-expanding");
          pagesContainer.style.clipPath = "none";
        }
      } catch (err) {
        pagesContainer.innerHTML = `<p>Error loading ${pageKey} page.</p>`;
      }
    }

    window.addEventListener("popstate", () => {
      loadPage(getCurrentPageKey(), false);
    });

    (async function initDashboard() {
      applyDashboardTheme();
      await loadUserFromDatabase();
      await loadUserCursorEffects();
      await loadProfileDrawer();
      await loadPage(getCurrentPageKey(), false);
    })();
  </script>
</body>
