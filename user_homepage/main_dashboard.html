<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signrest — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text-primary: #1c311e;
      --text-muted: #3c543e;
      --brand-color: #213d22;
      --veil-bg: rgba(226, 238, 222, 0.34);
      --pill-bg: rgba(235, 241, 229, 0.72);
      --pill-border: rgba(44, 74, 44, 0.24);
      --pill-hover: rgba(255, 255, 255, 0.88);
      --pill-active-bg: #2c4a2c;
      --pill-active-text: #f5f7f2;
      --top-slot-bg: rgba(244, 247, 240, 0.72);
      --top-slot-border: rgba(44, 74, 44, 0.25);
      --stage-bg: rgba(245, 247, 241, 0.42);
      --stage-border: rgba(255, 255, 255, 0.45);
    }

    body.dark-mode {
      --text-primary: #eef4ec;
      --text-muted: #b8c9b8;
      --brand-color: #e4f3e2;
      --veil-bg: rgba(11, 20, 16, 0.56);
      --pill-bg: rgba(24, 38, 29, 0.74);
      --pill-border: rgba(175, 212, 175, 0.22);
      --pill-hover: rgba(36, 56, 43, 0.92);
      --pill-active-bg: #4c7550;
      --pill-active-text: #ffffff;
      --top-slot-bg: rgba(25, 40, 31, 0.75);
      --top-slot-border: rgba(185, 220, 185, 0.26);
      --stage-bg: rgba(16, 28, 22, 0.46);
      --stage-border: rgba(165, 205, 170, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      font-family: 'Lora', Georgia, serif;
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* Layer 1: Fullscreen Blurred Landscape Background (`main_dashboard`) */
    .bg-photo-layer {
      position: fixed;
      inset: -20px;
      z-index: 0;
      background-size: cover;
      background-position: center;
      filter: blur(5px);
      transform: scale(1.03);
      transition: background-image 0.45s ease;
    }

    .bg-veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: var(--veil-bg);
      pointer-events: none;
      transition: background 0.35s ease;
    }

    .main-dashboard {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Top Header Bar */
    .dashboard-topbar {
      height: 68px;
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: var(--brand-color);
    }

    .brand-logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.78rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .sidebar-toggle-btn {
      margin-left: 6px;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--top-slot-border);
      background: var(--top-slot-bg);
      backdrop-filter: blur(8px);
      color: var(--text-primary);
      font-size: 1.1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .sidebar-toggle-btn:hover {
      transform: scale(1.05);
    }

    /* Top-Right Action Slots: Notification Bell + Light/Dark Switch + Profile Photo */
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-circle-slot {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 9999px;
      border: 1.5px solid var(--top-slot-border);
      background: var(--top-slot-bg);
      backdrop-filter: blur(10px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      color: var(--text-primary);
      box-shadow: 0 4px 14px rgba(16, 30, 18, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .top-circle-slot:hover {
      transform: scale(1.07);
      box-shadow: 0 6px 18px rgba(16, 30, 18, 0.2);
    }

    .top-circle-slot img.icon-img {
      width: 23px;
      height: 23px;
      object-fit: contain;
    }

    .top-circle-slot img.avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 9999px;
    }

    .noti-dot {
      position: absolute;
      top: 7px;
      right: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9f2323;
      border: 1.5px solid #ffffff;
    }

    /* Workspace: Floating Sidebar Pills + Elevated Page Container */
    .dashboard-workspace {
      flex: 1;
      display: flex;
      align-items: stretch;
      gap: 22px;
      padding: 6px 26px 24px 26px;
      min-height: calc(100vh - 68px);
    }
    #sidebarMount {
      display: flex;
      flex-shrink: 0;
    }

    /* Layer 2: Individual Floating Sidebar Pills (No outer sidebar box) */
    .sidebar-slot {
      width: 185px;
      flex-shrink: 100%;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 0 4px 0;
      transition: width 0.25s ease, opacity 0.2s ease;
    }

    .sidebar-slot.collapsed {
      width: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      margin-right: -22px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sidebar-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 18px;
      border-radius: 9999px;
      text-decoration: none;
      color: var(--text-primary);
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 16px rgba(15, 28, 16, 0.1);
      font-family: 'Lora', Georgia, serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .sidebar-pill:hover {
      transform: translateX(4px);
      background: var(--pill-hover);
      box-shadow: 0 8px 20px rgba(15, 28, 16, 0.16);
    }

    .sidebar-pill.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: transparent;
      font-weight: 600;
      box-shadow: 0 8px 22px rgba(24, 46, 26, 0.26);
    }

    .nav-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.65;
      flex-shrink: 0;
    }

    .sidebar-pill.active .nav-dot {
      opacity: 1;
      background: #b7e39c;
    }

    .logout-pill {
      justify-content: center;
      font-size: 0.88rem;
      opacity: 0.88;
    }

    .logout-pill:hover {
      color: #8c2323;
      opacity: 1;
    }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 24px;
    }

    /* Layer 3: Active Page Stage floating above `main_dashboard` */
    .pages-stage {
      flex: 1;
      border-radius: 24px;
      background: var(--stage-bg);
      border: 1px solid var(--stage-border);
      backdrop-filter: blur(8px);
      box-shadow: 0 14px 36px rgba(14, 28, 16, 0.14);
      padding: 20px 26px;
      overflow-y: auto;
      position: relative;
      z-index: 10;
    }

    @media (max-width: 860px) {
      .dashboard-workspace {
        flex-direction: column;
        padding: 6px 14px 18px 14px;
        gap: 14px;
      }
      .sidebar-slot {
        width: 100%;
        flex-direction: row;
        align-items: center;
        padding: 4px 0;
        overflow-x: auto;
      }
      .sidebar-slot.collapsed {
        height: 0;
        width: 100%;
        margin-right: 0;
      }
      .sidebar-nav {
        flex-direction: row;
        gap: 10px;
      }
      .sidebar-pill {
        width: auto;
        white-space: nowrap;
        padding: 9px 16px;
      }
      #sidebarMount {
        width: 100%;
      }
      .sidebar-footer {
        margin-top: 0;
        padding-top: 0;
        margin-left: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Layer 1: Blurred Forest Landscape Background -->
  <div id="bgPhotoLayer" class="bg-photo-layer"></div>
  <div class="bg-veil"></div>

  <div class="main-dashboard" id="mainDashboard">

    <!-- Topbar: Left (Brand + Hamburger) | Right (Notification Bell, Sun/Moon Theme, Profile Photo) -->
    <header class="dashboard-topbar">
      <div class="topbar-left">
        <a href="/home" class="brand-link">
          <img id="brandLogoImg" class="brand-logo-img" alt="Signrest Logo" />
          <span class="brand-name">Signrest</span>
        </a>
        <button
          type="button"
          id="sidebarToggleBtn"
          class="sidebar-toggle-btn"
          aria-label="Toggle Sidebar"
          title="Toggle Sidebar"
        >
          &#9776;
        </button>
      </div>

      <div class="topbar-right">
        <!-- 1. Notification Bell -->
        <a
          href="/home?page=notification"
          id="notiBellBtn"
          class="top-circle-slot"
          data-nav-target="notification"
          aria-label="Notifications"
          title="Notifications"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="noti-dot" aria-hidden="true"></span>
        </a>

        <!-- 2. Light / Dark Mode Switch (Sun / Moon Image) -->
        <button
          type="button"
          id="themeSlotBtn"
          class="top-circle-slot"
          aria-label="Toggle Light or Dark Mode"
          title="Switch Light / Dark Mode"
        >
          <img id="themeIconImg" class="icon-img" alt="Theme Toggle" />
        </button>

        <!-- 3. User Profile Photo -->
        <a
          href="/home?page=profile"
          id="profileSlotBtn"
          class="top-circle-slot"
          data-nav-target="profile"
          aria-label="Profile"
          title="Profile"
        >
          <span id="profileInitialText" class="font-semibold text-sm">U</span>
          <img id="profileAvatarImg" class="avatar-img" style="display:none;" alt="Profile Photo" />
        </a>
      </div>
    </header>

    <!-- Main Body: Individual Floating Sidebar Pills + Elevated Page Container -->
    <div class="dashboard-workspace">
      <div id="sidebarMount"></div>

      <main class="pages-stage" id="pagesContainer">
        <p style="text-align:center; padding:40px 0;">Loading Signrest workspace...</p>
      </main>
    </div>

  </div>

  <script>
    const DASHBOARD_ASSETS = {
      logo:     "../assets/images/logo.png",
      bgLight:  "../assets/images/login_bg_11.jpg",
      bgDark:   "../assets/images/login_bg_night_1.jpg",
      iconSun:  "../assets/images/sun_bgremove.png",
      iconMoon: "../assets/images/moon_bgremove.png"
    };

    const DASHBOARD_FALLBACKS = {
      logo:     "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='#3e5d3e'/><path d='M20 40 C20 26, 34 18, 46 20 C44 33, 35 43, 20 40 Z' fill='#b9e396'/></svg>`),
      iconSun:  "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='#f59e0b' stroke='#f59e0b' stroke-width='2'><circle cx='12' cy='12' r='5'/></svg>`),
      iconMoon: "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='#e2e8f0'><path d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'/></svg>`)
    };

    const PAGE_ROUTES = {
      translation:  "/user_homepage/translation.html",
      learning:     "/user_homepage/learning.html",
      notification: "/user_homepage/notification.html",
      profile:      "/user_homepage/profile.html"
    };

    let currentTheme = localStorage.getItem("signrest_theme") === "dark" ? "dark" : "light";

    const bgPhotoLayer = document.getElementById("bgPhotoLayer");
    const brandLogoImg = document.getElementById("brandLogoImg");
    const themeIconImg = document.getElementById("themeIconImg");
    const sidebarMount = document.getElementById("sidebarMount");
    const pagesContainer = document.getElementById("pagesContainer");
    const sidebarToggleBtn = document.getElementById("sidebarToggleBtn");

    function applyDashboardTheme() {
      const isDark = currentTheme === "dark";
      document.body.classList.toggle("dark-mode", isDark);
      document.documentElement.setAttribute("data-theme", currentTheme);
      localStorage.setItem("signrest_theme", currentTheme);

      brandLogoImg.onerror = () => {
        brandLogoImg.onerror = null;
        brandLogoImg.src = DASHBOARD_FALLBACKS.logo;
      };
      brandLogoImg.src = DASHBOARD_ASSETS.logo;

      const iconKey = isDark ? "iconMoon" : "iconSun";
      themeIconImg.onerror = () => {
        themeIconImg.onerror = null;
        themeIconImg.src = DASHBOARD_FALLBACKS[iconKey];
      };
      themeIconImg.src = DASHBOARD_ASSETS[iconKey];

      bgPhotoLayer.style.backgroundImage = `url('${isDark ? DASHBOARD_ASSETS.bgDark : DASHBOARD_ASSETS.bgLight}')`;
    }

    document.getElementById("themeSlotBtn").addEventListener("click", () => {
      currentTheme = currentTheme === "light" ? "dark" : "light";
      applyDashboardTheme();
    });

    async function loadUserTopbarProfile() {
      try {
        const res = await fetch("/api/user/me");
        if (!res.ok) return;
        const user = await res.json();
        const initialEl = document.getElementById("profileInitialText");
        const avatarEl = document.getElementById("profileAvatarImg");

        const displayName = user.username || user.email || "U";
        initialEl.textContent = displayName.trim().charAt(0).toUpperCase();

        if (user.profile_photo) {
          avatarEl.src = user.profile_photo;
          avatarEl.style.display = "block";
          initialEl.style.display = "none";
        }
      } catch (err) {}
    }

    function getCurrentPageKey() {
      const params = new URLSearchParams(window.location.search);
      const key = (params.get("page") || "translation").toLowerCase();
      return PAGE_ROUTES[key] ? key : "translation";
    }

    function setActiveSidebarLink(pageKey) {
      document.querySelectorAll("#sidebarMount .sidebar-pill[data-page]").forEach((link) => {
        link.classList.toggle("active", link.dataset.page === pageKey);
      });
    }

    function navigateToPage(targetPage) {
      if (!PAGE_ROUTES[targetPage]) return;
      window.history.pushState({ page: targetPage }, "", `/home?page=${targetPage}`);
      loadPage(targetPage);
    }

    async function loadSidebar() {
      const res = await fetch("/user_homepage/sidebar.html");
      sidebarMount.innerHTML = await res.text();

      const sidebarEl = document.getElementById("floatingSidebar");
      sidebarToggleBtn.addEventListener("click", () => {
        sidebarEl.classList.toggle("collapsed");
      });

      document.querySelectorAll("#sidebarMount .sidebar-pill[data-page]").forEach((link) => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          navigateToPage(link.dataset.page);
        });
      });

      const logoutBtn = document.getElementById("sidebarLogoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          await fetch("/api/logout", { method: "POST" });
          window.location.href = "/login";
        });
      }
    }

    // Topbar Notification & Profile buttons also navigate cleanly inside the shell
    document.querySelectorAll("[data-nav-target]").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        navigateToPage(el.dataset.navTarget);
      });
    });

    async function loadPage(pageKey) {
      setActiveSidebarLink(pageKey);
      const fileUrl = PAGE_ROUTES[pageKey];

      try {
        const res = await fetch(fileUrl);
        if (!res.ok) {
          pagesContainer.innerHTML = `<h2 style="margin-bottom:8px;">${pageKey.toUpperCase()}</h2><p>Page file (${fileUrl}) will be built next.</p>`;
          return;
        }
        const html = await res.text();
        const parsed = new DOMParser().parseFromString(html, "text/html");

        // Inject page styles & main content
        pagesContainer.innerHTML = "";
        parsed.querySelectorAll("style").forEach((styleTag) => {
          pagesContainer.appendChild(styleTag.cloneNode(true));
        });

        const pageRoot = parsed.getElementById("translatePageRoot") || parsed.body;
        Array.from(pageRoot.children).forEach((child) => {
          if (child.tagName !== "SCRIPT") {
            pagesContainer.appendChild(child.cloneNode(true));
          }
        });

        // Execute page scripts in order
        const scripts = Array.from(parsed.querySelectorAll("script"));
        for (const oldScript of scripts) {
          await new Promise((resolve) => {
            const newScript = document.createElement("script");
            if (oldScript.src) {
              newScript.src = oldScript.src;
              newScript.onload = resolve;
              newScript.onerror = resolve;
            } else {
              newScript.textContent = oldScript.textContent;
              resolve();
            }
            document.body.appendChild(newScript);
          });
        }
      } catch (err) {
        pagesContainer.innerHTML = `<p>Error loading ${pageKey} page.</p>`;
      }
    }

    window.addEventListener("popstate", () => {
      loadPage(getCurrentPageKey());
    });

    (async function initDashboard() {
      applyDashboardTheme();
      await loadUserTopbarProfile();
      await loadSidebar();
      await loadPage(getCurrentPageKey());
    })();
  </script>
</body>
</html>
