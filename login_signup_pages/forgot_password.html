<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signrest — Forgot Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth_style.css" />
</head>
<body>

  <!-- 1. Fullscreen Blurred Background Photo Layer (Uses Login Background Swatches) -->
  <div id="bgPhotoLayer" class="bg-photo-layer"></div>
  <div class="bg-veil"></div>

  <!-- 2. Top-Left Brand Logo & "Signrest" Name -->
  <header class="brand-header">
    <img id="brandLogoImg" class="brand-logo-img" alt="Signrest Logo" />
    <span class="brand-title">Signrest</span>
  </header>

  <!-- 3. Top-Right Light / Dark Mode Switch Button -->
  <button
    type="button"
    id="themeToggleBtn"
    class="theme-toggle-btn"
    aria-label="Toggle Light or Dark Mode"
    title="Switch Light / Dark Mode"
  >
    <img id="themeIconImg" alt="Theme Toggle Icon" />
  </button>

  <!-- 4. Invalid Email Megaphone Popup Notification -->
  <div id="leafToastWrapper" class="leaf-toast-wrapper" role="alert" aria-live="assertive">
    <div id="leafToastCard" class="leaf-toast-card toast-horn">
      <img
        id="leafToastHornImg"
        class="leaf-toast-plane"
        style="top: -38px; left: -40px; width: 102px; transform: rotate(-22deg);"
        alt=""
      />
      <button type="button" id="leafToastCloseBtn" class="leaf-toast-close" aria-label="Close notification">
        X
      </button>
      <p id="leafToastMessage" class="leaf-toast-text">
        Invalid Email!
      </p>
      <!-- 5-segment 5-second countdown line -->
      <div class="leaf-toast-bars" aria-hidden="true">
        <span class="leaf-toast-bar" data-step="0"></span>
        <span class="leaf-toast-bar" data-step="1"></span>
        <span class="leaf-toast-bar" data-step="2"></span>
        <span class="leaf-toast-bar" data-step="3"></span>
        <span class="leaf-toast-bar" data-step="4"></span>
      </div>
    </div>
  </div>

  <!-- 5. Foreground Scenery Cutout Layer -->
  <div class="scenery-layer">
    <div class="rock-frog-group">
      <img id="sceneryRock" class="scenery-item scenery-rock" alt="" />
      <div class="frog-lamp-aura" aria-hidden="true"></div>
      <button type="button" id="frogThemeToggleBtn" class="frog-theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
        <img id="sceneryFrog" class="scenery-item scenery-frog" alt="" />
      </button>
    </div>

    <img id="sceneryBush1" class="scenery-item scenery-bush-left" alt="" />
    <img id="sceneryBush2" class="scenery-item scenery-bush-mid-left" alt="" />
    <img id="sceneryBush3" class="scenery-item scenery-bush-mid-right" alt="" />
    <img id="sceneryBushRight" class="scenery-item scenery-bush-right" alt="" />
  </div>

  <!-- 6. Centered Forgot Password Form -->
  <main class="relative z-20 min-h-screen flex flex-col items-center justify-center px-6 pb-28 sm:pb-20 pt-10 pointer-events-none">
    <div class="w-full max-w-[295px] pointer-events-auto">

      <h1
        class="text-center text-[2rem] sm:text-[2.2rem] font-normal tracking-wide mb-9"
        style="color: var(--text-primary); font-family: 'Lora', Georgia, serif;"
      >
        Forgot Password
      </h1>

      <form id="forgotForm" novalidate>
        <div class="mb-7">
          <label for="emailInput" class="field-label">Email</label>
          <input
            type="email"
            id="emailInput"
            name="email"
            class="underlined-field"
            autocomplete="email"
            required
          />
          <p id="emailErrorMsg" class="field-error-msg" aria-live="polite"></p>
        </div>

        <!-- NEXT Pill Button (Frozen until email format is valid) -->
        <button type="submit" id="nextBtn" class="btn-primary-pill" disabled>
          NEXT
        </button>

        <div class="text-center mt-5">
          <a href="/login" class="sub-link text-[0.86rem]">back to login</a>
        </div>
      </form>

    </div>
  </main>

  <script>
    const ASSETS = {
      logo:          "../assets/images/logo.png",
      alertHorn:     "../assets/images/login_invalid_horn.png",
      bgLoginLight:  "../assets/images/login_bg_8.jpg",
      bgLoginDark:   "../assets/images/login_bg_night_6.jpg",
      frog:          "../assets/images/frog-removebg.png",
      rockLight:     "../assets/images/stone-removebg.png",
      rockDark:      "../assets/images/rock_night.png",
      bush3xLight:   "../assets/images/bush_bgremove.png",
      bush3xDark:    "../assets/images/bush_night.png",
      bushRightLight:"../assets/images/bush_1_bgremove.png",
      bushRightDark: "../assets/images/bush_1_night.png",
      iconSun:       "../assets/images/sun_bgremove.png",
      iconMoon:      "../assets/images/moon_bgremove.png"
    };

    const PREVIEW_FALLBACKS = {
      logo:      "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='#3e5d3e'/><path d='M20 40 C20 26, 34 18, 46 20 C44 33, 35 43, 20 40 Z' fill='#b9e396'/></svg>`),
      alertHorn: "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><g transform='rotate(-26 60 60)'><path d='M16 48 L44 48 L44 72 L16 72 Z' fill='#9e2020'/><path d='M44 46 L94 24 L94 96 L44 74 Z' fill='#ece6d6' stroke='#b92525' stroke-width='4'/><path d='M36 72 L44 102 L58 98 L48 72 Z' fill='#d6c9b4'/></g></svg>`)
    };

    const savedTheme = localStorage.getItem("signrest_theme");
    let theme = savedTheme === "dark" ? "dark" : "light";
    let isSubmitting = false;
    let emailTouched = false;

    const bgPhotoLayer = document.getElementById("bgPhotoLayer");
    const emailInput = document.getElementById("emailInput");
    const emailErrorMsg = document.getElementById("emailErrorMsg");
    const nextBtn = document.getElementById("nextBtn");

    const leafToastWrapper = document.getElementById("leafToastWrapper");
    const leafToastHornImg = document.getElementById("leafToastHornImg");
    const leafToastMessage = document.getElementById("leafToastMessage");
    const leafToastCloseBtn = document.getElementById("leafToastCloseBtn");
    const leafToastBars = Array.from(document.querySelectorAll(".leaf-toast-bar"));
    let toastInterval = null;

    function applyImageWithFallback(imgEl, assetKey) {
      if (PREVIEW_FALLBACKS[assetKey]) {
        imgEl.onerror = () => {
          imgEl.onerror = null;
          imgEl.src = PREVIEW_FALLBACKS[assetKey];
        };
      }
      imgEl.src = ASSETS[assetKey];
    }

    function renderTheme() {
      const isDark = theme === "dark";
      const nextThemeLabel = `Switch to ${isDark ? "light" : "dark"} mode`;
      document.body.classList.toggle("dark-mode", isDark);
      localStorage.setItem("signrest_theme", theme);
      const frogThemeToggleBtn = document.getElementById("frogThemeToggleBtn");
      frogThemeToggleBtn.setAttribute("aria-label", nextThemeLabel);
      frogThemeToggleBtn.title = nextThemeLabel;

      applyImageWithFallback(document.getElementById("brandLogoImg"), "logo");
      applyImageWithFallback(leafToastHornImg, "alertHorn");
      document.getElementById("themeIconImg").src = isDark ? ASSETS.iconMoon : ASSETS.iconSun;

      document.getElementById("sceneryRock").src = isDark ? ASSETS.rockDark : ASSETS.rockLight;
      document.getElementById("sceneryBush1").src = isDark ? ASSETS.bush3xDark : ASSETS.bush3xLight;
      document.getElementById("sceneryBush2").src = isDark ? ASSETS.bush3xDark : ASSETS.bush3xLight;
      document.getElementById("sceneryBush3").src = isDark ? ASSETS.bush3xDark : ASSETS.bush3xLight;
      document.getElementById("sceneryBushRight").src = isDark ? ASSETS.bushRightDark : ASSETS.bushRightLight;
      document.getElementById("sceneryFrog").src = ASSETS.frog;

      bgPhotoLayer.style.backgroundImage = `url('${isDark ? ASSETS.bgLoginDark : ASSETS.bgLoginLight}')`;
    }

    function triggerAlert(message) {
      if (toastInterval) clearInterval(toastInterval);
      leafToastMessage.textContent = message;
      leafToastBars.forEach((bar) => bar.classList.remove("elapsed"));
      leafToastWrapper.classList.add("show");

      let elapsed = 0;
      toastInterval = setInterval(() => {
        if (elapsed < 5) {
          const idx = 4 - elapsed;
          if (leafToastBars[idx]) leafToastBars[idx].classList.add("elapsed");
          elapsed += 1;
        } else {
          hideAlert();
        }
      }, 1000);
    }

    function hideAlert() {
      if (toastInterval) {
        clearInterval(toastInterval);
        toastInterval = null;
      }
      leafToastWrapper.classList.remove("show");
    }

    leafToastCloseBtn.addEventListener("click", hideAlert);

    function validateEmail(forceShow = false) {
      const val = emailInput.value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
      const valid = emailRegex.test(val);

      if ((emailTouched || forceShow) && !valid) {
        emailErrorMsg.textContent = !val ? "Email is required." : "Please enter a valid email address.";
      } else {
        emailErrorMsg.textContent = "";
      }

      if (!isSubmitting) {
        nextBtn.disabled = !valid;
      }
      return valid;
    }

    emailInput.addEventListener("input", () => {
      emailTouched = true;
      validateEmail(false);
    });

    function toggleTheme() {
      theme = theme === "light" ? "dark" : "light";
      renderTheme();
    }

    document.getElementById("themeToggleBtn").addEventListener("click", toggleTheme);
    document.getElementById("frogThemeToggleBtn").addEventListener("click", toggleTheme);

    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert();
      if (!validateEmail(true)) return;

      const email = emailInput.value.trim();
      isSubmitting = true;
      nextBtn.disabled = true;
      nextBtn.innerHTML = `<span class="btn-spinner" aria-hidden="true"></span>`;

      try {
        const res = await fetch("/api/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
          triggerAlert(data.message || "Invalid Email!");
          isSubmitting = false;
          nextBtn.innerHTML = "NEXT";
          validateEmail(false);
        } else {
          sessionStorage.setItem("signrest_otp_just_sent", "1");
          window.location.href =
            data.redirect_url || `/verify-otp?email=${encodeURIComponent(email)}&purpose=forgot_password`;
        }
      } catch (err) {
        isSubmitting = false;
        nextBtn.innerHTML = "NEXT";
        validateEmail(false);
        triggerAlert("Server connection error. Please try again.");
      }
    });

    renderTheme();
  </script>
</body>
</html>
